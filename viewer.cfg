# Picture Viewer settings.  Put this file in /viewer on the SD card.
# Lines starting with # are notes; take the # off a line to use it.

# seconds each picture stays up in a slide show (s key)
delay = 10

# order of the slide show: name, or shuffle
order = name

# the folder the viewer starts in (and autostart shows); /pictures if
# this isn't given
# folder = /pictures/Christmas

# yes: start a slide show of that folder as soon as the viewer opens,
# like a picture frame.  Any key stops it.
# autostart = yes

# run at the RP2350's rated 150 MHz instead of the viewer's 250
# speed = normal
